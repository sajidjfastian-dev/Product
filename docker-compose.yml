services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      Frontend__Origin: http://localhost:8081
      ConnectionStrings__Products: "Server=host.docker.internal,${SQLSERVER_PORT:?Set SQLSERVER_PORT in .env};Database=ProductCatalogDb;User Id=${SQLSERVER_USER:?Set SQLSERVER_USER in .env};Password=${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    environment:
      ASPNETCORE_HTTP_PORTS: 8081
      ProductsApiUrl: http://localhost:8080
    ports:
      - "8081:8081"
    depends_on:
      - api
    restart: unless-stopped
