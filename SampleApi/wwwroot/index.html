<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Product catalog administration">
  <title>Product Catalog</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">INVENTORY</p>
        <h1>Product catalog</h1>
        <p class="subtitle">Manage products in your catalog.</p>
      </div>
      <a class="button button-secondary" href="/api/products/pdf">Download PDF</a>
    </header>

    <section class="panel form-panel" aria-labelledby="form-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">CATALOG ITEM</p>
          <h2 id="form-title">Add a product</h2>
        </div>
        <button id="cancel-edit" class="button button-secondary hidden" type="button">Cancel edit</button>
      </div>
      <form id="product-form">
        <div class="form-grid">
          <label>
            <span>Product name</span>
            <input id="name" name="name" maxlength="120" placeholder="e.g. Wireless Mouse" required>
          </label>
          <label>
            <span>Category</span>
            <input id="category" name="category" maxlength="80" placeholder="e.g. Accessories" required>
          </label>
          <label>
            <span>Price</span>
            <input id="price" name="price" type="number" min="0" step="0.01" placeholder="0.00" required>
          </label>
          <label>
            <span>Stock</span>
            <input id="stock" name="stock" type="number" min="0" step="1" placeholder="0" required>
          </label>
        </div>
        <div class="form-footer">
          <p id="message" class="message" role="status" aria-live="polite"></p>
          <button id="save-button" class="button button-primary" type="submit">Add product</button>
        </div>
      </form>
    </section>

    <section class="panel inventory-panel" aria-labelledby="inventory-title">
      <div class="section-heading inventory-heading">
        <div>
          <p class="eyebrow">YOUR INVENTORY</p>
          <h2 id="inventory-title">Products <span id="product-count" class="count">0</span></h2>
        </div>
        <label class="search">
          <span class="visually-hidden">Search products</span>
          <input id="search" type="search" placeholder="Search products">
        </label>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Product</th>
              <th scope="col">Category</th>
              <th scope="col">Price</th>
              <th scope="col">Stock</th>
              <th scope="col"><span class="visually-hidden">Actions</span></th>
            </tr>
          </thead>
          <tbody id="product-rows"></tbody>
        </table>
      </div>
      <p id="empty-state" class="empty-state hidden">No products match your search.</p>
    </section>
    <footer>Product Catalog <span>·</span> SQL Server inventory</footer>
  </main>
</body>
</html>
